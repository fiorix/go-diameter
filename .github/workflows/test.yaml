---
name: test
on: [push, pull_request]
permissions: read-all
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Test with the latest patched Go rather than the go.mod minimum:
          # stdlib fixes (crypto/tls, crypto/x509) only reach builds made
          # with a current toolchain.
          go-version: 'stable'
          check-latest: true
      - run: |
          go test -v -race -cover -timeout 300s ./diam/...
